name: CI - Tests, Coverage and Docker Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependências do backend
        run: npm ci

      - name: Aguardar MongoDB
        run: |
          for i in {1..10}; do
            nc -z localhost 27017 && echo "Mongo OK" && exit 0
            echo "Aguardando Mongo..."
            sleep 3
          done
          echo "Mongo não respondeu a tempo"
          exit 1

      - name: Rodar testes com coverage
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/blogdb_test
        run: npm run test:coverage

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: ./frontend
        run: npm ci

      - name: Build do frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:3000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Build da imagem Docker do backend
        run: docker build -t challenge-backend:ci .

      - name: Build da imagem Docker do frontend
        run: docker build -t challenge-frontend:ci ./frontend